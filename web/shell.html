<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Twin Stick Shooter</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1018; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game renders at a fixed 16:9 size and CSS scales the element to fit
     whatever iframe itch.io gives it.

     The element's own box has to keep that 16:9 shape. Letterboxing inside a
     larger box with object-fit would put the picture somewhere the pointer
     mapping knows nothing about, and every click would land off target. */
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    outline: none;
  }
  #status {
    position: absolute;
    color: #8a93a8;
    font: 14px ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading</div>
<script>
  var statusElement = document.getElementById("status");
  var canvasElement = document.getElementById("canvas");

  var Module = {
    canvas: canvasElement,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
    setStatus: function (text) {
      if (!statusElement) return;
      if (text) {
        statusElement.textContent = text;
        return;
      }
      // Empty status means the runtime is up. Drop the label and give the
      // canvas focus, or the first key press goes to the page instead.
      statusElement.remove();
      statusElement = null;
      canvasElement.focus();
    },
  };

  // Clicking back into the game after clicking away restores keyboard input.
  canvasElement.addEventListener("mousedown", function () { canvasElement.focus(); });
  window.onerror = function (message) { Module.setStatus("Failed to load: " + message); };
</script>
{{{ SCRIPT }}}
</body>
</html>
